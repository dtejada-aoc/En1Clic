<!DOCTYPE html>
<html lang="ca">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>Editor</title>
				<style> body{
      font-family: system-ui, sans-serif;
      margin:0;
      background:#f5f7fb;
      color:#1f2937;
    }
    a{
      text-decoration:none;
      color:inherit;
    }
    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:32px;
    }
    .nav{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }
    .btn{
      padding:10px 14px;
      border-radius:12px;
      background:#2563eb;
      color:#fff;
      font-weight:600;
    }
    .card{
      background:#fff;
      border:1px solid #dbe3f0;
      border-radius:18px;
      padding:18px;
      box-shadow:0 10px 30px rgba(31,41,55,.08);
      margin-bottom:18px;
    }
    .card h2{
      margin:0 0 16px;
      font-size:1.1rem;
    }
    .form-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
    }
    .field label{
      display:block;
      font-weight:600;
      margin-bottom:6px;
    }
    .field input,
    .field textarea{
      width:100%;
      padding:12px 14px;
      border:1px solid #cbd5e1;
      border-radius:12px;
      font:inherit;
      background:#fff;
      box-sizing:border-box;
    }
    .field textarea{
      min-height:110px;
      resize:vertical;
    }

    .dual-selector{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }
    .selector-box{
      border:1px solid #cbd5e1;
      border-radius:14px;
      overflow:hidden;
      background:#fff;
    }
    .selector-box h3{
      margin:0;
      padding:12px 14px;
      background:#eef4ff;
      font-size:0.98rem;
      border-bottom:1px solid #cbd5e1;
    }
    .selector-box .content{
      padding:12px;
    }
    .selector-box select{
      width:100%;
      min-height:220px;
      border:1px solid #cbd5e1;
      border-radius:10px;
      padding:10px;
      font:inherit;
      background:#fff;
      box-sizing:border-box;
    }
    .hint{
      margin-top:8px;
      font-size:.9rem;
      color:#6b7280;
    }

    @media (max-width: 780px){
      .wrap{ padding:18px; }
      .dual-selector{
        grid-template-columns:1fr;
      }
    }</style>
			</head>
			<body>
				<div class="wrap">
				<a href="https://dtejada-aoc.github.io/En1Clic/"><image src="En1Clic.png" style="width:100px;height:40px;"></a>
					<h1>Editor de consentiment</h1>
					<div class="nav">
						<a class="btn" href="index.html">Inici</a>
						<a class="btn" href="consentiments.html">Consentiments</a>
						<a class="btn" href="editor.html">Editor</a>
						<a class="btn" href="consultes.html">Consultes</a>
						<a class="btn" href="tracabilitat.html">Traçabilitat</a>
						<a class="btn" href="configuracio.html">Configuració</a>
					</div>
					<div class="card" name="DadesGenerals">
      <h2>Dades generals</h2>
      <div class="form-grid">
        <div class="field">
          <label for="nom">Nom</label>
          <input id="nom" type="text" value="Escolarització" />
        </div>
        <div class="field">
          <label for="descripcio">Descripció</label>
          <textarea id="descripcio">Procés d'accés a serveis educatius o primera matrícula.</textarea>
        </div>
      </div>
    </div>

					
					 <div class="card" name="tramitsVO">
      <h2>Tràmits VO</h2>

		<table> 
		<tr>
		<td>
      
        <div class="selector-box">
          <h3>Opcions seleccionades</h3>
          <div class="content">
            <select multiple size="10">
              <option>Consulta del padró</option>
			  <option >Consulta DGP</option>
			  <option >Consulta IRPF</option>

			  
            </select>
            <div class="hint">Llistat estàtic de les opcions ja assignades.</div>
          </div>
        
		</td>
		<td align="center">
			<a class="btn"> < Habilitar </a>	
<br>
<br>			
			<a class="btn"> Treure > </a>		
			<br>
		</td>
		
		<td>
		
        <div class="selector-box">
		
          <h3>Opcions disponibles</h3>
          <div class="content">
            <select multiple size="10">
			<option >Consulta del Registre Civil</option>
              <option >Alta Empadronament</option>
              <option >Alta TGSS</option>
              
              <option>Modificació Empadronament</option>
              <option>Alta Registre Civil</option>
              <option>Consulta Cementiris</option>
              <option>Consulta de les últimes voluntats</option>
            </select>
            <div class="hint">Llistat estàtic de les opcions disponibles.</div>
          </div>
        </div>
      </div>
		</td>
		</tr>
		</table>
	</div>
	
	<div class="actions">
		<a class="btn" href="editor.html">Tornar Enrere</a>											
		<a class="btn" href="editor.html">Desar</a>	
	</div>
					
				</div>
			</body>
		</html>
