<!DOCTYPE html>
<html lang="ca">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>Nou consentiment</title>
				<style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#1f2937}a{text-decoration:none;color:inherit}input,select{width:100%;padding:12px 14px;border:1px solid #dbe3f0;border-radius:12px;font:inherit;background:#fff}.wrap{max-width:1100px;margin:0 auto;padding:32px}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.btn{padding:10px 14px;border-radius:12px;background:#2563eb;color:#fff;font-weight:600;display:inline-block;border:0;cursor:pointer}.btn.secondary{background:#fff;color:#1f2937;border:1px solid #dbe3f0}.card{background:#fff;border:1px solid #dbe3f0;border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(31,41,55,.08)}.grid{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:14px}.field{display:grid;gap:8px}.field.full{grid-column:1/-1}.muted{color:#6b7280}.section{margin-top:18px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef4ff;color:#1d4ed8;font-size:12px;font-weight:700}@media (max-width:900px){.grid{grid-template-columns:1fr}}</style>
			</head>
			<body>
				<div class="wrap">
				<a href="https://dtejada-aoc.github.io/En1Clic/"><image src="En1Clic.png" style="width:100px;height:40px;"></a>
					<h1>Nou consentiment · Naixement d'un nadó</h1>
					<p class="muted">Formulari d’alta amb les dades específiques d’aquest tipus de consentiment.</p>
					<div class="nav">
						<a class="btn" href="index.html">Inici</a>
						<a class="btn" href="consentiments.html">Consentiments</a>
						<a class="btn" href="editor.html">Editor</a>
						<a class="btn" href="consultes.html">Consultes</a>
						<a class="btn" href="tracabilitat.html">Traçabilitat</a>
						<a class="btn" href="configuracio.html">Configuració</a>
					</div>
					<div class="card">
						<span class="badge">Alta</span>
						<div class="section">
							<h2>Dades de l'expedient</h2>
							<div class="grid">
								<div class="field">
									<label>Número d'expedient</label>
									<input type="text" placeholder="EX-2026-0001"/>
									<div class="field">
										<label>Data d'alta</label>
										<input type="date"/>
									</div>
								</div>
							</div>
							<div class="grid">
								<div class="section">
									<h2>Dades dels familiars</h2>
									<div class="grid">
										<div class="field">
											<label>Nom i cognoms</label>
											<input type="text" placeholder="Nom complet"/>
											<div class="field">
												<label>Mòbil de contacte</label>
												<input type="tel" placeholder="600 000 000"/>
											</div>
										</div>
										</div>
							<div class="grid">
										<div class="section">
											<h2>Lloc d'empadronament</h2>
											<div class="grid">
												<div class="field full">
													<label>Adreça</label>
													<input type="text" placeholder="Carrer, número, pis"/>
													<div class="field">
														<label>Municipi</label>
														<input type="text" value="Tossa de Mar"/>
														<div class="field">
															<label>Codi postal</label>
															<input type="text" placeholder="17320"/>
														</div>
													</div>
													<div class="section" style="display:flex;gap:10px;justify-content:flex-end">
														<button class="btn secondary">Desar esborrany</button>
														<button class="btn">Crear consentiment</button>
													</div>
												</div>
											</div>
										</body>
									</html>
